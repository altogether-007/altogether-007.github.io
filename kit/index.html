<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>QuickDrop</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  min-height:100vh;
  font-family:system-ui,-apple-system,Segoe UI,sans-serif;
  background:linear-gradient(135deg,#111827,#312e81);
  color:#fff;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:20px;
}

.app{
  width:min(94%,650px);
  text-align:center;
}

.logo{
  font-size:38px;
  font-weight:800;
}

.sub{
  color:#cbd5e1;
  margin-bottom:25px;
}

.card{
  background:rgba(255,255,255,.09);
  border:1px solid rgba(255,255,255,.15);
  border-radius:25px;
  padding:25px;
  backdrop-filter:blur(18px);
  box-shadow:0 25px 70px #0006;
}

.status{
  margin:15px 0;
  color:#cbd5e1;
}

.dot{
  display:inline-block;
  width:10px;
  height:10px;
  border-radius:50%;
  background:#64748b;
  margin-right:6px;
}

.dot.online{
  background:#22c55e;
  box-shadow:0 0 10px #22c55e;
}

button{
  border:0;
  border-radius:14px;
  padding:14px 22px;
  font-size:16px;
  font-weight:700;
  cursor:pointer;
  color:white;
  background:#6366f1;
}

button:hover{
  background:#4f46e5;
}

button.secondary{
  background:#334155;
}

button.danger{
  background:#dc2626;
}

button:disabled{
  opacity:.5;
  cursor:not-allowed;
}

.buttons{
  display:flex;
  gap:10px;
  justify-content:center;
  flex-wrap:wrap;
}

.panel{
  margin-top:20px;
  padding:18px;
  background:#0002;
  border-radius:18px;
}

.hidden{
  display:none!important;
}

.room{
  font-size:42px;
  font-weight:900;
  letter-spacing:8px;
  margin:15px 0;
  color:#a5b4fc;
}

#qr{
  width:max-content;
  margin:15px auto;
  padding:15px;
  background:#fff;
  border-radius:15px;
}

textarea{
  width:100%;
  min-height:70px;
  border:0;
  border-radius:12px;
  padding:12px;
  resize:vertical;
  font-family:monospace;
}

.drop{
  display:block;
  margin-top:20px;
  padding:50px 20px;
  border:2px dashed #818cf8;
  border-radius:20px;
  cursor:pointer;
}

.drop:hover,
.drop.drag{
  background:#6366f122;
}

.icon{
  font-size:55px;
}

input[type=file]{
  display:none;
}

.progress{
  margin-top:18px;
  text-align:left;
}

.progress-head{
  display:flex;
  justify-content:space-between;
  margin-bottom:7px;
  font-size:14px;
}

.bar{
  height:9px;
  background:#334155;
  border-radius:20px;
  overflow:hidden;
}

.fill{
  height:100%;
  width:0;
  background:linear-gradient(90deg,#6366f1,#22c55e);
}

#scanner{
  position:relative;
  max-width:420px;
  margin:15px auto;
  overflow:hidden;
  border-radius:18px;
  background:#000;
}

#video{
  width:100%;
  display:block;
}

.scan-frame{
  position:absolute;
  width:65%;
  aspect-ratio:1;
  left:17.5%;
  top:17.5%;
  border:3px solid #22c55e;
  border-radius:20px;
}

.scan-line{
  position:absolute;
  left:20%;
  width:60%;
  height:3px;
  background:#22c55e;
  box-shadow:0 0 10px #22c55e;
  animation:scan 2s linear infinite;
}

@keyframes scan{
  0%{top:20%}
  50%{top:78%}
  100%{top:20%}
}

footer{
  margin-top:18px;
  color:#94a3b8;
  font-size:13px;
}
</style>
</head>

<body>

<div class="app">

<div class="logo">⚡ QuickDrop</div>

<div class="sub">
Send files directly between browsers
</div>

<div class="card">

<div class="status">
<span id="dot" class="dot"></span>
<span id="status">Ready</span>
</div>

<div class="buttons">

<button id="createBtn">
📤 Create Connection
</button>

<button id="joinBtn" class="secondary">
📥 Join Connection
</button>

</div>


<!-- CREATE -->

<div id="createPanel" class="panel hidden">

<h3>Share this code</h3>

<div id="roomCode" class="room">
------
</div>

<div id="qr"></div>

<small>
Scan this QR or enter the 6-digit code on the other device.
</small>

</div>


<!-- JOIN -->

<div id="joinPanel" class="panel hidden">

<h3>Join Connection</h3>

<div class="buttons">

<button id="scanBtn">
📷 Scan QR
</button>

<button
id="manualBtn"
class="secondary"
>
⌨️ Enter Code
</button>

</div>


<!-- SCANNER -->

<div
id="scannerPanel"
class="hidden"
>

<div id="scanner">

<video
id="video"
autoplay
playsinline
muted
></video>

<div class="scan-frame"></div>
<div class="scan-line"></div>

</div>

<canvas
id="canvas"
style="display:none"
></canvas>

<p id="scanMessage">
Point camera at QR code.
</p>

<button
id="stopScanBtn"
class="danger"
>
✕ Stop
</button>

</div>


<!-- CODE INPUT -->

<div
id="codePanel"
class="hidden"
>

<p>
Enter the 6-digit code:
</p>

<input
id="codeInput"
inputmode="numeric"
maxlength="6"
placeholder="123456"
style="
width:100%;
padding:16px;
border:0;
border-radius:12px;
font-size:28px;
font-weight:800;
text-align:center;
letter-spacing:8px;
"
>

<div class="buttons" style="margin-top:12px">

<button id="joinCodeBtn">
Join
</button>

</div>

</div>

</div>


<!-- FILE DROP -->

<label
id="drop"
class="drop"
for="fileInput"
>

<div class="icon">📁</div>

<h2>Choose files</h2>

<p>
Click here or drag & drop files
</p>

<input
id="fileInput"
type="file"
multiple
>

</label>

<div id="progress"></div>

</div>

<footer>
WebRTC • Peer-to-peer file transfer
</footer>

</div>


<script>
"use strict";

/* =========================
CONFIG
========================= */

/*
 IMPORTANT:
 Replace this with your deployed
 WebSocket server URL.

 Example:
 wss://quickdrop-server.example.com
*/
const SIGNALING_SERVER =
"wss://YOUR-SERVER-DOMAIN";


const CHUNK =
64 * 1024;

const MAX_BUFFER =
CHUNK * 8;

const ICE_SERVERS = [

{
urls:
"stun:stun.l.google.com:19302"
}

];


/* =========================
ELEMENTS
========================= */

const statusEl =
document.getElementById("status");

const dot =
document.getElementById("dot");

const createBtn =
document.getElementById("createBtn");

const joinBtn =
document.getElementById("joinBtn");

const createPanel =
document.getElementById("createPanel");

const joinPanel =
document.getElementById("joinPanel");

const roomCode =
document.getElementById("roomCode");

const qr =
document.getElementById("qr");

const scanBtn =
document.getElementById("scanBtn");

const manualBtn =
document.getElementById("manualBtn");

const scannerPanel =
document.getElementById("scannerPanel");

const codePanel =
document.getElementById("codePanel");

const codeInput =
document.getElementById("codeInput");

const joinCodeBtn =
document.getElementById("joinCodeBtn");

const stopScanBtn =
document.getElementById("stopScanBtn");

const video =
document.getElementById("video");

const canvas =
document.getElementById("canvas");

const scanMessage =
document.getElementById("scanMessage");

const fileInput =
document.getElementById("fileInput");

const drop =
document.getElementById("drop");

const progress =
document.getElementById("progress");


/* =========================
STATE
========================= */

let socket = null;
let pc = null;
let channel = null;

let currentRoom = null;
let role = null;

let incoming = null;

let cameraStream = null;
let scanning = false;


/* =========================
HELPERS
========================= */

function status(text){

statusEl.textContent =
text;

}


function online(value){

dot.classList.toggle(
"online",
value
);

}


function show(el){

el.classList.remove(
"hidden"
);

}


function hide(el){

el.classList.add(
"hidden"
);

}


function randomId(){

return Math.random()
.toString(36)
.slice(2,10);

}


/* =========================
SIGNALING
========================= */

function connectSocket(){

return new Promise(
(resolve,reject)=>{

socket =
new WebSocket(
SIGNALING_SERVER
);


socket.onopen = () => {

resolve();

};


socket.onerror = () => {

reject(
new Error(
"WebSocket connection failed"
)
);

};


socket.onclose = () => {

if(
pc &&
pc.connectionState !==
"connected"
){

status(
"Signaling server disconnected."
);

}

};


socket.onmessage =
event => {

handleSignal(
JSON.parse(event.data)
);

};

});
}


function sendSignal(data){

if(
socket &&
socket.readyState ===
WebSocket.OPEN
){

socket.send(
JSON.stringify(data)
);

}

}


/* =========================
CREATE ROOM
========================= */

async function createConnection(){

try{

role = "host";

status(
"Connecting to server..."
);

await connectSocket();


sendSignal({

type:"create-room"

});


}catch(error){

console.error(error);

status(
"❌ Cannot connect to server."
);

alert(
"Signaling server unavailable."
);

}

}


/* =========================
JOIN ROOM
========================= */

async function joinRoom(code){

code =
code.replace(
/[^0-9]/g,
""
);


if(
code.length !== 6
){

alert(
"Enter a valid 6-digit code."
);

return;

}


try{

role = "guest";

status(
"Connecting to server..."
);

await connectSocket();


sendSignal({

type:"join-room",

room:code

});


currentRoom =
code;


}catch(error){

console.error(error);

alert(
"Signaling server unavailable."
);

}

}


/* =========================
SIGNAL HANDLER
========================= */

async function handleSignal(msg){

try{

/*
 Server created a room.
*/

if(
msg.type === "room-created"
){

currentRoom =
msg.room;

roomCode.textContent =
msg.room;

qr.innerHTML = "";


/*
 QR contains only a small
 QuickDrop join URL.
*/

const joinUrl =
location.origin +
location.pathname +
"?join=" +
msg.room;


new QRCode(
qr,
{
text:joinUrl,
width:240,
height:240
}
);


show(createPanel);

status(
"🟢 Room created. Waiting for device..."
);

return;

}


/*
 Guest joined.
 Host creates WebRTC offer.
*/

if(
msg.type === "peer-joined"
){

status(
"Creating secure connection..."
);

await createOffer();

return;

}


/*
 Guest receives offer.
*/

if(
msg.type === "offer"
){

await receiveOffer(
msg.data
);

return;

}


/*
 Host receives answer.
*/

if(
msg.type === "answer"
){

await receiveAnswer(
msg.data
);

return;

}


/*
 ICE candidate.
*/

if(
msg.type === "candidate"
){

if(pc){

await pc.addIceCandidate(
msg.data
);

}

return;

}


/*
 Error.
*/

if(
msg.type === "error"
){

status(
"❌ " +
msg.message
);

alert(
msg.message
);

}

}catch(error){

console.error(
"Signal error:",
error
);

}

}


/* =========================
PEER
========================= */

function createPeer(){

if(pc){

try{
pc.close();
}catch{}

}


pc =
new RTCPeerConnection({

iceServers:
ICE_SERVERS

});


pc.onicecandidate =
event => {

if(
event.candidate
){

sendSignal({

type:"candidate",

room:
currentRoom,

data:
event.candidate

});

}

};


pc.onconnectionstatechange =
() => {

const state =
pc.connectionState;


status(
"Connection: " +
state
);


if(
state === "connected"
){

online(true);

status(
"🟢 Connected! Ready to transfer files."
);

}

};


pc.oniceconnectionstatechange =
() => {

if(
pc.iceConnectionState ===
"failed"
){

status(
"❌ Connection failed."
);

}

};

}


/* =========================
CHANNEL
========================= */

function setupChannel(ch){

channel =
ch;

channel.binaryType =
"arraybuffer";

channel.bufferedAmountLowThreshold =
CHUNK * 2;


channel.onopen =
() => {

online(true);

status(
"🟢 Connected! Ready to transfer files."
);

};


channel.onclose =
() => {

online(false);

status(
"Connection closed."
);

};


channel.onerror =
() => {

status(
"❌ Data channel error."
);

};


channel.onmessage =
receiveData;

}


/* =========================
CREATE OFFER
========================= */

async function createOffer(){

createPeer();


channel =
pc.createDataChannel(
"quickdrop",
{
ordered:true
}
);

setupChannel(channel);


const offer =
await pc.createOffer();


await pc.setLocalDescription(
offer
);


await waitForICE();


sendSignal({

type:"offer",

room:
currentRoom,

data:
pc.localDescription

});


status(
"Waiting for device..."
);

}


/* =========================
RECEIVE OFFER
========================= */

async function receiveOffer(offer){

createPeer();


pc.ondatachannel =
event => {

setupChannel(
event.channel
);

};


await pc.setRemoteDescription(
new RTCSessionDescription(
offer
)
);


const answer =
await pc.createAnswer();


await pc.setLocalDescription(
answer
);


await waitForICE();


sendSignal({

type:"answer",

room:
currentRoom,

data:
pc.localDescription

});


status(
"Connecting..."
);

}


/* =========================
RECEIVE ANSWER
========================= */

async function receiveAnswer(answer){

await pc.setRemoteDescription(
new RTCSessionDescription(
answer
)
);


status(
"Connecting..."
);

}


/* =========================
ICE WAIT
========================= */

function waitForICE(){

return new Promise(
resolve => {

if(
pc.iceGatheringState ===
"complete"
){

resolve();

return;

}


let finished = false;


const finish = () => {

if(finished)
return;

finished = true;

clearTimeout(
timeout
);

pc.removeEventListener(
"icegatheringstatechange",
check
);

resolve();

};


const check = () => {

if(
pc.iceGatheringState ===
"complete"
){

finish();

}

};


const timeout =
setTimeout(
finish,
7000
);


pc.addEventListener(
"icegatheringstatechange",
check
);

});
}


/* =========================
PROGRESS
========================= */

function createProgress(name){

const box =
document.createElement(
"div"
);

box.className =
"progress";


box.innerHTML = `

<div class="progress-head">

<b>
${escapeHTML(name)}
</b>

<span>
0%
</span>

</div>

<div class="bar">

<div class="fill"></div>

</div>

`;


progress.appendChild(
box
);


return {

fill:
box.querySelector(
".fill"
),

percent:
box.querySelector(
".progress-head span"
)

};

}


function escapeHTML(text){

return text.replace(
/[&<>"']/g,
c => ({

"&":"&amp;",
"<":"&lt;",
">":"&gt;",
'"':"&quot;",
"'":"&#039;"

}[c])
);

}


/* =========================
BUFFER
========================= */

async function waitForBuffer(){

while(
channel &&
channel.bufferedAmount >
MAX_BUFFER
){

await new Promise(
resolve =>
setTimeout(
resolve,
30
)
);

}

}


/* =========================
SEND
========================= */

async function sendFile(file){

const ui =
createProgress(
"Sending: " +
file.name
);


channel.send(
JSON.stringify({

type:"start",

name:
file.name,

size:
file.size,

mime:
file.type ||
"application/octet-stream"

})
);


let offset = 0;


while(
offset < file.size
){

await waitForBuffer();


const chunk =
await file
.slice(
offset,
offset + CHUNK
)
.arrayBuffer();


channel.send(
chunk
);


offset +=
chunk.byteLength;


const percent =
file.size === 0
? 100
: Math.round(
offset /
file.size *
100
);


ui.fill.style.width =
percent + "%";


ui.percent.textContent =
percent + "%";

}


channel.send(
JSON.stringify({
type:"end"
})
);

}


/* =========================
SEND FILES
========================= */

async function sendFiles(files){

if(
!channel ||
channel.readyState !==
"open"
){

alert(
"Connect another device first."
);

return;

}


for(
const file of files
){

await sendFile(
file
);

}


status(
"✅ Transfer complete."
);

}


/* =========================
RECEIVE
========================= */

function receiveData(event){

if(
typeof event.data ===
"string"
){

let msg;


try{

msg =
JSON.parse(
event.data
);

}catch{

return;

}


if(
msg.type === "start"
){

incoming = {

name:
msg.name,

size:
Number(msg.size),

mime:
msg.mime ||
"application/octet-stream",

received:0,

chunks:[],

ui:
createProgress(
"Receiving: " +
msg.name
)

};

return;

}


if(
msg.type === "end"
){

finishIncoming();

return;

}


return;

}


if(
!incoming
)
return;


if(
event.data instanceof
ArrayBuffer
){

incoming.chunks.push(
event.data
);

incoming.received +=
event.data.byteLength;


const percent =
incoming.size === 0
? 100
: Math.min(
100,
Math.round(
incoming.received /
incoming.size *
100
)
);


incoming.ui.fill.style.width =
percent + "%";


incoming.ui.percent.textContent =
percent + "%";

}

}


/* =========================
FINISH RECEIVE
========================= */

function finishIncoming(){

if(
!incoming
)
return;


const info =
incoming;


const blob =
new Blob(
info.chunks,
{
type:info.mime
}
);


const url =
URL.createObjectURL(
blob
);


const a =
document.createElement(
"a"
);


a.href =
url;

a.download =
info.name;


document.body.appendChild(
a
);

a.click();

a.remove();


setTimeout(
() =>
URL.revokeObjectURL(
url
),
5000
);


status(
"✅ Received: " +
info.name
);


incoming = null;

}


/* =========================
QR SCANNER
========================= */

async function startScanner(){

try{

cameraStream =
await navigator.mediaDevices
.getUserMedia({

video:{
facingMode:{
ideal:"environment"
}
},

audio:false

});


video.srcObject =
cameraStream;


await video.play();


scanning = true;

show(scannerPanel);

scanLoop();


}catch(error){

console.error(error);

alert(
"Camera permission denied.\n\nUse HTTPS and allow camera access."
);

}

}


function scanLoop(){

if(
!scanning
)
return;


if(
video.readyState >=
HTMLMediaElement.HAVE_ENOUGH_DATA
){

const width =
video.videoWidth;

const height =
video.videoHeight;


if(width && height){

canvas.width =
width;

canvas.height =
height;


const ctx =
canvas.getContext(
"2d",
{
willReadFrequently:true
}
);


ctx.drawImage(
video,
0,
0,
width,
height
);


const image =
ctx.getImageData(
0,
0,
width,
height
);


const code =
jsQR(
image.data,
image.width,
image.height,
{
inversionAttempts:
"attemptBoth"
}
);


if(
code &&
code.data
){

scanning = false;

stopCamera();


const url =
code.data;


try{

const parsed =
new URL(url);


const codeValue =
parsed.searchParams
.get("join");


if(
codeValue
){

codeInput.value =
codeValue;

hide(scannerPanel);

joinRoom(
codeValue
);

return;

}

}catch{}

scanLoop();

return;

}

}

}


requestAnimationFrame(
scanLoop
);

}


function stopCamera(){

if(
cameraStream
){

cameraStream
.getTracks()
.forEach(
track =>
track.stop()
);

cameraStream = null;

}

video.srcObject = null;

}


function stopScanner(){

scanning = false;

stopCamera();

hide(scannerPanel);

}


/* =========================
BUTTONS
========================= */

createBtn.onclick =
createConnection;


joinBtn.onclick =
() => {

show(joinPanel);

hide(createPanel);

status(
"Scan or enter the room code."
);

};


scanBtn.onclick =
() => {

hide(codePanel);

startScanner();

};


stopScanBtn.onclick =
stopScanner;


manualBtn.onclick =
() => {

stopScanner();

show(codePanel);

};


joinCodeBtn.onclick =
() => {

joinRoom(
codeInput.value
);

};


/* =========================
FILE
========================= */

fileInput.onchange =
() => {

if(
fileInput.files.length
){

sendFiles(
fileInput.files
);

}

fileInput.value = "";

};


/* =========================
DRAG DROP
========================= */

[
"dragenter",
"dragover"
].forEach(
name => {

drop.addEventListener(
name,
e => {

e.preventDefault();

drop.classList.add(
"drag"
);

}
);

}
);


[
"dragleave",
"drop"
].forEach(
name => {

drop.addEventListener(
name,
e => {

e.preventDefault();

drop.classList.remove(
"drag"
);

}
);

}
);


drop.addEventListener(
"drop",
e => {

const files =
e.dataTransfer.files;

if(files.length){

sendFiles(
files
);

}

}
);


/* =========================
AUTO JOIN FROM QR URL
========================= */

const params =
new URLSearchParams(
location.search
);

const autoJoin =
params.get("join");


if(autoJoin){

show(joinPanel);

joinRoom(
autoJoin
);

}

</script>

</body>
</html>
