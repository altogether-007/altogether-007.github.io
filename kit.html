<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>QuickDrop</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  min-height:100vh;
  font-family:system-ui,-apple-system,Segoe UI,sans-serif;
  background:linear-gradient(135deg,#111827,#312e81);
  color:#fff;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:20px;
}

.app{
  width:min(94%,650px);
  text-align:center;
}

.logo{
  font-size:38px;
  font-weight:800;
  margin-bottom:5px;
}

.sub{
  color:#cbd5e1;
  margin-bottom:25px;
}

.card{
  background:rgba(255,255,255,.09);
  border:1px solid rgba(255,255,255,.15);
  border-radius:25px;
  padding:25px;
  backdrop-filter:blur(18px);
  box-shadow:0 25px 70px #0006;
}

button{
  border:0;
  border-radius:14px;
  padding:14px 22px;
  font-size:16px;
  font-weight:700;
  cursor:pointer;
  color:white;
  background:#6366f1;
}

button:hover{
  background:#4f46e5;
}

button.secondary{
  background:#334155;
}

button.danger{
  background:#dc2626;
}

button:disabled{
  opacity:.5;
  cursor:not-allowed;
}

.status{
  margin:15px 0;
  color:#cbd5e1;
}

.hidden{
  display:none!important;
}

.panel{
  margin-top:18px;
  padding:18px;
  background:#0002;
  border-radius:18px;
}

#qr{
  margin:20px auto;
  padding:15px;
  background:white;
  width:max-content;
  border-radius:15px;
}

.code{
  margin-top:10px;
  background:#020617;
  color:#94a3b8;
  padding:8px;
  border-radius:10px;
  font-size:9px;
  line-height:1.2;
  max-height:55px;
  overflow:auto;
  word-break:break-all;
  text-align:left;
}

textarea{
  width:100%;
  min-height:65px;
  margin-top:8px;
  border:0;
  border-radius:10px;
  padding:10px;
  resize:vertical;
  font-family:monospace;
  font-size:11px;
  outline:none;
}

textarea:focus{
  box-shadow:0 0 0 2px #818cf8;
}

.drop{
  display:block;
  margin-top:20px;
  padding:50px 20px;
  border:2px dashed #818cf8;
  border-radius:20px;
  cursor:pointer;
}

.drop:hover,
.drop.drag{
  background:#6366f122;
}

.icon{
  font-size:55px;
}

input[type=file]{
  display:none;
}

.progress{
  margin-top:20px;
  text-align:left;
}

.progress-head{
  display:flex;
  justify-content:space-between;
  margin-bottom:6px;
  font-size:14px;
}

.bar{
  height:9px;
  background:#334155;
  border-radius:20px;
  overflow:hidden;
}

.fill{
  height:100%;
  width:0;
  background:linear-gradient(90deg,#6366f1,#22c55e);
}

.actions{
  display:flex;
  gap:8px;
  justify-content:center;
  flex-wrap:wrap;
  margin-top:10px;
}

#scanner{
  position:relative;
  width:100%;
  max-width:420px;
  margin:15px auto;
  border-radius:18px;
  overflow:hidden;
  background:#000;
}

#video{
  width:100%;
  display:block;
}

.scan-frame{
  position:absolute;
  width:65%;
  aspect-ratio:1;
  left:17.5%;
  top:17.5%;
  border:3px solid #22c55e;
  border-radius:20px;
}

.scan-line{
  position:absolute;
  left:20%;
  width:60%;
  height:3px;
  background:#22c55e;
  box-shadow:0 0 10px #22c55e;
  animation:scan 2s linear infinite;
}

@keyframes scan{
  0%{top:20%}
  50%{top:78%}
  100%{top:20%}
}

footer{
  margin-top:18px;
  color:#94a3b8;
  font-size:13px;
}
</style>
</head>

<body>

<div class="app">

<div class="logo">⚡ QuickDrop</div>

<div class="sub">
Send files directly between browsers
</div>

<div class="card">

<div id="status" class="status">
Ready
</div>

<div class="actions">

<button id="createBtn">
📤 Create Connection
</button>

<button id="joinBtn" class="secondary">
📥 Join Connection
</button>

</div>


<!-- CREATOR -->

<div id="creatorPanel" class="panel hidden">

<h3>📱 Scan this QR</h3>

<div id="qr"></div>

<small>
Scan this QR from the other device.
</small>

<div class="code" id="offerCode"></div>

<div class="actions">

<button id="copyOfferBtn" class="secondary">
📋 Copy
</button>

</div>

<hr style="border-color:#ffffff18;margin:18px 0">

<small>
Paste answer:
</small>

<textarea
id="answerInput"
placeholder="Paste answer..."
></textarea>

<div class="actions">

<button id="connectBtn">
Connect
</button>

</div>

</div>


<!-- JOIN -->

<div id="joinPanel" class="panel hidden">

<h3>📥 Join Connection</h3>

<div class="actions">

<button id="scanBtn">
📷 Scan QR
</button>

<button
id="manualBtn"
class="secondary"
>
⌨️ Paste
</button>

</div>


<!-- CAMERA -->

<div
id="scannerPanel"
class="hidden"
>

<div id="scanner">

<video
id="video"
autoplay
playsinline
muted
></video>

<div class="scan-frame"></div>
<div class="scan-line"></div>

</div>

<canvas
id="canvas"
style="display:none"
></canvas>

<p id="scanMessage">
Point camera at QR code.
</p>

<button
id="stopScanBtn"
class="danger"
>
✕ Stop
</button>

</div>


<!-- MANUAL -->

<div
id="manualPanel"
class="hidden"
>

<textarea
id="offerInput"
placeholder="Paste offer..."
></textarea>

<div class="actions">

<button id="generateAnswerBtn">
Generate Answer
</button>

</div>

</div>


<!-- ANSWER -->

<div
id="answerPanel"
class="hidden"
>

<hr style="border-color:#ffffff18">

<small>
Copy this answer to Device A:
</small>

<div
id="answerCode"
class="code"
></div>

<div class="actions">

<button
id="copyAnswerBtn"
class="secondary"
>
📋 Copy Answer
</button>

</div>

</div>

</div>


<!-- FILE -->

<label
id="drop"
class="drop"
for="fileInput"
>

<div class="icon">📁</div>

<h2>Choose files</h2>

<p>
Click here or drag & drop files
</p>

<input
id="fileInput"
type="file"
multiple
>

</label>

<div id="progress"></div>

</div>

<footer>
WebRTC • Browser-to-browser transfer
</footer>

</div>


<script>
"use strict";


/* =========================
ELEMENTS
========================= */

const statusEl =
document.getElementById("status");

const createBtn =
document.getElementById("createBtn");

const joinBtn =
document.getElementById("joinBtn");

const creatorPanel =
document.getElementById("creatorPanel");

const joinPanel =
document.getElementById("joinPanel");

const qr =
document.getElementById("qr");

const offerCode =
document.getElementById("offerCode");

const answerCode =
document.getElementById("answerCode");

const answerInput =
document.getElementById("answerInput");

const offerInput =
document.getElementById("offerInput");

const connectBtn =
document.getElementById("connectBtn");

const generateAnswerBtn =
document.getElementById(
"generateAnswerBtn"
);

const copyOfferBtn =
document.getElementById(
"copyOfferBtn"
);

const copyAnswerBtn =
document.getElementById(
"copyAnswerBtn"
);

const scanBtn =
document.getElementById("scanBtn");

const stopScanBtn =
document.getElementById(
"stopScanBtn"
);

const manualBtn =
document.getElementById("manualBtn");

const scannerPanel =
document.getElementById(
"scannerPanel"
);

const manualPanel =
document.getElementById(
"manualPanel"
);

const answerPanel =
document.getElementById(
"answerPanel"
);

const video =
document.getElementById("video");

const canvas =
document.getElementById("canvas");

const scanMessage =
document.getElementById(
"scanMessage"
);

const fileInput =
document.getElementById(
"fileInput"
);

const drop =
document.getElementById("drop");

const progress =
document.getElementById(
"progress"
);


/* =========================
WEBRTC
========================= */

let pc = null;
let channel = null;

const CHUNK =
64 * 1024;

const MAX_BUFFER =
CHUNK * 8;

const ICE_SERVERS = [

{
urls:
"stun:stun.l.google.com:19302"
}

];


/* =========================
RECEIVE
========================= */

let incoming = null;


/* =========================
CAMERA
========================= */

let cameraStream = null;
let scanning = false;


/* =========================
HELPERS
========================= */

function status(text){

statusEl.textContent =
text;

}


function show(el){

el.classList.remove(
"hidden"
);

}


function hide(el){

el.classList.add(
"hidden"
);

}


function sleep(ms){

return new Promise(
resolve =>
setTimeout(resolve,ms)
);

}


function escapeHTML(text){

return text.replace(
/[&<>"']/g,
c => ({

"&":"&amp;",
"<":"&lt;",
">":"&gt;",
'"':"&quot;",
"'":"&#039;"

}[c])
);

}


async function copyText(text){

try{

await navigator.clipboard.writeText(
text
);

status(
"✅ Copied"
);

}catch{

alert(
"Copy failed. Copy manually."
);

}

}


/* =========================
CREATE PEER
========================= */

function createPeer(){

if(pc){

try{
pc.close();
}catch{}

}

pc =
new RTCPeerConnection({

iceServers:
ICE_SERVERS

});


pc.onconnectionstatechange =
() => {

status(
"Connection: " +
pc.connectionState
);

};


pc.oniceconnectionstatechange =
() => {

if(
pc.iceConnectionState ===
"failed"
){

status(
"❌ Connection failed"
);

}

};

}


/* =========================
DATA CHANNEL
========================= */

function setupChannel(ch){

channel = ch;

channel.binaryType =
"arraybuffer";

channel.bufferedAmountLowThreshold =
CHUNK * 2;


channel.onopen = () => {

status(
"🟢 Connected! Ready to send files."
);

};


channel.onclose = () => {

status(
"Connection closed."
);

};


channel.onerror = () => {

status(
"❌ Data channel error."
);

};


channel.onmessage =
receiveData;

}


/* =========================
CREATE CONNECTION
========================= */

async function createConnection(){

stopScanner();

createPeer();


channel =
pc.createDataChannel(
"quickdrop",
{
ordered:true
}
);

setupChannel(channel);


const offer =
await pc.createOffer();

await pc.setLocalDescription(
offer
);


status(
"Preparing QR..."
);


await waitForICE();


const data =
JSON.stringify(
pc.localDescription
);


offerCode.textContent =
data;


qr.innerHTML = "";


new QRCode(
qr,
{
text:data,
width:240,
height:240,
correctLevel:
QRCode.CorrectLevel.M
}
);


show(creatorPanel);

hide(joinPanel);


status(
"📱 Scan this QR from Device B."
);

}


/* =========================
JOIN
========================= */

function openJoin(){

stopScanner();

hide(creatorPanel);

show(joinPanel);

status(
"Scan the QR from Device A."
);

}


/* =========================
PROCESS OFFER
========================= */

async function processOffer(raw){

try{

const offer =
JSON.parse(
raw.trim()
);


if(
offer.type !== "offer" ||
!offer.sdp
){

throw new Error(
"Invalid offer"
);

}


stopScanner();

createPeer();


pc.ondatachannel =
event => {

setupChannel(
event.channel
);

};


await pc.setRemoteDescription(
new RTCSessionDescription(
offer
)
);


const answer =
await pc.createAnswer();


await pc.setLocalDescription(
answer
);


status(
"Creating answer..."
);


await waitForICE();


const data =
JSON.stringify(
pc.localDescription
);


answerCode.textContent =
data;


show(answerPanel);


status(
"✅ Answer ready."
);


}catch(error){

console.error(error);

alert(
"Invalid offer / QR."
);

}

}


/* =========================
CONNECT ANSWER
========================= */

async function connectAnswer(){

try{

const answer =
JSON.parse(
answerInput.value.trim()
);


if(
answer.type !== "answer" ||
!answer.sdp
){

throw new Error();

}


await pc.setRemoteDescription(
new RTCSessionDescription(
answer
)
);


status(
"Connecting..."
);


}catch(error){

alert(
"Invalid answer."
);

}

}


/* =========================
ICE
========================= */

function waitForICE(){

return new Promise(resolve => {

if(
pc.iceGatheringState ===
"complete"
){

resolve();
return;

}


let finished = false;


const finish = () => {

if(finished)
return;

finished = true;

clearTimeout(
timeout
);

pc.removeEventListener(
"icegatheringstatechange",
check
);

resolve();

};


const check = () => {

if(
pc.iceGatheringState ===
"complete"
){

finish();

}

};


const timeout =
setTimeout(
finish,
7000
);


pc.addEventListener(
"icegatheringstatechange",
check
);

});

}


/* =========================
PROGRESS
========================= */

function createProgress(name){

const box =
document.createElement("div");

box.className =
"progress";


box.innerHTML = `

<div class="progress-head">

<b>
${escapeHTML(name)}
</b>

<span>
0%
</span>

</div>

<div class="bar">

<div class="fill"></div>

</div>

`;


progress.appendChild(box);


return {

fill:
box.querySelector(".fill"),

percent:
box.querySelector(
".progress-head span"
)

};

}


/* =========================
BUFFER
========================= */

async function waitForBuffer(){

while(
channel &&
channel.bufferedAmount >
MAX_BUFFER
){

await sleep(30);

}

}


/* =========================
SEND
========================= */

async function sendFile(file){

const ui =
createProgress(
"Sending: " +
file.name
);


channel.send(
JSON.stringify({

type:"start",

name:file.name,

size:file.size,

mime:
file.type ||
"application/octet-stream"

})
);


let offset = 0;


while(
offset < file.size
){

await waitForBuffer();


const chunk =
await file
.slice(
offset,
offset + CHUNK
)
.arrayBuffer();


channel.send(
chunk
);


offset +=
chunk.byteLength;


const percent =
file.size === 0
? 100
: Math.round(
offset /
file.size *
100
);


ui.fill.style.width =
percent + "%";


ui.percent.textContent =
percent + "%";

}


channel.send(
JSON.stringify({
type:"end"
})
);

}


/* =========================
SEND FILES
========================= */

async function sendFiles(files){

if(
!channel ||
channel.readyState !== "open"
){

alert(
"Connect another device first."
);

return;

}


for(
const file of files
){

await sendFile(file);

}


status(
"✅ Transfer complete."
);

}


/* =========================
RECEIVE
========================= */

function receiveData(event){

if(
typeof event.data ===
"string"
){

let msg;


try{

msg =
JSON.parse(
event.data
);

}catch{

return;

}


if(
msg.type === "start"
){

incoming = {

name:
msg.name,

size:
Number(msg.size),

mime:
msg.mime ||
"application/octet-stream",

received:0,

chunks:[],

ui:
createProgress(
"Receiving: " +
msg.name
)

};


return;

}


if(
msg.type === "end"
){

finishIncoming();

return;

}


return;

}


if(!incoming)
return;


if(
event.data instanceof
ArrayBuffer
){

handleChunk(
event.data
);

}

}


/* =========================
CHUNK
========================= */

function handleChunk(chunk){

if(!incoming)
return;


incoming.chunks.push(
chunk
);


incoming.received +=
chunk.byteLength;


const percent =
incoming.size === 0
? 100
: Math.min(
100,
Math.round(
incoming.received /
incoming.size *
100
)
);


incoming.ui.fill.style.width =
percent + "%";


incoming.ui.percent.textContent =
percent + "%";

}


/* =========================
FINISH
========================= */

function finishIncoming(){

if(!incoming)
return;


const info =
incoming;


const blob =
new Blob(
info.chunks,
{
type:info.mime
}
);


const url =
URL.createObjectURL(
blob
);


const a =
document.createElement("a");


a.href = url;

a.download =
info.name;


document.body.appendChild(a);

a.click();

a.remove();


setTimeout(
() =>
URL.revokeObjectURL(url),
5000
);


status(
"✅ Received: " +
info.name
);


incoming = null;

}


/* =========================
QR SCANNER
========================= */

async function startScanner(){

if(
!navigator.mediaDevices ||
!navigator.mediaDevices.getUserMedia
){

alert(
"Camera is not supported."
);

return;

}


try{

cameraStream =
await navigator.mediaDevices
.getUserMedia({

video:{
facingMode:{
ideal:"environment"
}
},

audio:false

});


video.srcObject =
cameraStream;


await video.play();


scanning = true;

show(scannerPanel);


scanMessage.textContent =
"Point camera at QR code.";


scanLoop();


}catch(error){

console.error(error);

alert(
"Camera permission denied.\n\n" +
"Use HTTPS or localhost."
);

}

}


function scanLoop(){

if(!scanning)
return;


if(
video.readyState >=
HTMLMediaElement.HAVE_ENOUGH_DATA
){

const width =
video.videoWidth;

const height =
video.videoHeight;


if(width && height){

canvas.width =
width;

canvas.height =
height;


const ctx =
canvas.getContext(
"2d",
{
willReadFrequently:true
}
);


ctx.drawImage(
video,
0,
0,
width,
height
);


const image =
ctx.getImageData(
0,
0,
width,
height
);


const code =
jsQR(
image.data,
image.width,
image.height,
{
inversionAttempts:
"attemptBoth"
}
);


if(
code &&
code.data
){

scanning = false;

scanMessage.textContent =
"✅ QR detected!";


stopCamera();


offerInput.value =
code.data;


processOffer(
code.data
);


return;

}

}

}


requestAnimationFrame(
scanLoop
);

}


function stopCamera(){

if(cameraStream){

cameraStream
.getTracks()
.forEach(
track =>
track.stop()
);

cameraStream = null;

}

video.srcObject = null;

}


function stopScanner(){

scanning = false;

stopCamera();

hide(scannerPanel);

}


/* =========================
BUTTONS
========================= */

createBtn.onclick =
createConnection;

joinBtn.onclick =
openJoin;

connectBtn.onclick =
connectAnswer;


generateAnswerBtn.onclick =
() =>
processOffer(
offerInput.value
);


copyOfferBtn.onclick =
() =>
copyText(
offerCode.textContent
);


copyAnswerBtn.onclick =
() =>
copyText(
answerCode.textContent
);


scanBtn.onclick =
() => {

hide(manualPanel);

startScanner();

};


stopScanBtn.onclick =
stopScanner;


manualBtn.onclick =
() => {

stopScanner();

show(manualPanel);

};


/* =========================
FILE
========================= */

fileInput.onchange =
() => {

if(
fileInput.files.length
){

sendFiles(
fileInput.files
);

}

fileInput.value = "";

};


/* =========================
DRAG DROP
========================= */

[
"dragenter",
"dragover"
].forEach(
eventName => {

drop.addEventListener(
eventName,
event => {

event.preventDefault();

drop.classList.add(
"drag"
);

}
);

}
);


[
"dragleave",
"drop"
].forEach(
eventName => {

drop.addEventListener(
eventName,
event => {

event.preventDefault();

drop.classList.remove(
"drag"
);

}
);

}
);


drop.addEventListener(
"drop",
event => {

const files =
event.dataTransfer.files;

if(files.length){

sendFiles(files);

}

}
);


/* =========================
CLEANUP
========================= */

window.addEventListener(
"beforeunload",
() => {

stopScanner();

if(pc){

try{
pc.close();
}catch{}

}

}
);

</script>

</body>
</html>
