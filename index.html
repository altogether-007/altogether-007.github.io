<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Altogether 007</title>
    <meta name="description" content="Altogether 007">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #000;
            font-family: Arial, Helvetica, sans-serif;
        }

        .enter {
            display: inline-block;
            padding: 15px 50px;
            border: 2px solid #00ffff;
            border-radius: 10px;
            background: #111;
            color: #00bfff;
            text-decoration: none;
            font-size: 20px;
            font-weight: bold;
            transition: 0.3s ease;
        }

        .enter:hover {
            background: #00bfff;
            color: #000;
            transform: scale(1.05);
        }
    </style>
</head>

<body>

    <a class="enter" href="https://altogether-007.github.io/official/">
        ENTER
    </a>

</body>
</html>
